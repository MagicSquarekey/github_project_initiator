<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="title">github_project_initiator · 项目管理</title>
<style>
/* ============================================================
   主题变量：明 / 暗 两套，由 html[data-theme] 切换
   ============================================================ */
:root[data-theme="dark"] {
  --bg:            #0f1115;
  --bg-grad:       radial-gradient(1200px 600px at 50% -10%, #1a1f2b 0%, #0f1115 60%);
  --card:          #171a21;
  --card-hover:    #1c2029;
  --border:        #262b36;
  --border-strong: #333a48;
  --text:          #e6e9ef;
  --text-dim:      #8b93a7;
  --text-faint:    #5c6478;
  --green:         #3fb950;
  --red:           #f85149;
  --amber:         #d29922;
  --blue:          #58a6ff;
  --accent:        #7c6cf0;
  --accent-hover:  #8f82f5;
  --btn-bg:        #21252e;
  --btn-bg-hover:  #2a2f3a;
  --shadow:        0 1px 3px rgba(0,0,0,.4);
  --code-bg:       #12151c;
}
:root[data-theme="light"] {
  --bg:            #f4f6fa;
  --bg-grad:       radial-gradient(1200px 600px at 50% -10%, #ffffff 0%, #eef1f7 60%);
  --card:          #ffffff;
  --card-hover:    #fbfcfe;
  --border:        #e2e6ee;
  --border-strong: #cbd2e0;
  --text:          #1a1f2b;
  --text-dim:      #5f6880;
  --text-faint:    #9aa3b8;
  --green:         #1a7f37;
  --red:           #cf222e;
  --amber:         #9a6700;
  --blue:          #0969da;
  --accent:        #6c5ce7;
  --accent-hover:  #8173ea;
  --btn-bg:        #f0f2f7;
  --btn-bg-hover:  #e4e8f0;
  --shadow:        0 1px 3px rgba(16,24,40,.08);
  --code-bg:       #f6f8fb;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg-grad), var(--bg);
  background-attachment: fixed;
  color: var(--text);
  font: 14px/1.55 -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  transition: background-color .2s, color .2s;
}

/* ============================================================
   顶栏
   ============================================================ */
header {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 14px 22px; border-bottom: 1px solid var(--border);
  background: color-mix(in srgb, var(--card) 88%, transparent);
  backdrop-filter: blur(10px);
  position: sticky; top: 0; z-index: 20;
}
.brand { font-size: 15px; font-weight: 650; letter-spacing: .2px; white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; }
.brand b { color: var(--accent); font-weight: 700; }
.brand .ver { color: var(--text-faint); font-size: 11px; font-weight: 400; margin-left: 2px; }
.brand-icon { width: 20px; height: 20px; color: var(--text); flex: none; }
:root[data-theme="light"] .brand-icon { color: #1a1f2b; }

.stat { display: flex; align-items: center; gap: 6px; color: var(--text-dim); font-size: 13px; white-space: nowrap; }
.stat b { color: var(--text); font-variant-numeric: tabular-nums; }
.led-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex: none; }

.spacer { flex: 1; }

/* ============================================================
   按钮
   ============================================================ */
button {
  font: inherit; font-size: 13px; color: var(--text);
  background: var(--btn-bg); border: 1px solid var(--border);
  border-radius: 7px; padding: 6px 12px; cursor: pointer;
  transition: background-color .15s, border-color .15s, color .15s, transform .06s;
  white-space: nowrap;
}
button:hover:not(:disabled) { background: var(--btn-bg-hover); border-color: var(--border-strong); }
button:active:not(:disabled) { transform: translateY(1px); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
button.danger:hover:not(:disabled) { color: var(--red); border-color: var(--red); }
button.ghost { background: transparent; }
button.icon { padding: 6px 9px; display: inline-flex; align-items: center; gap: 5px; }
button.icon svg { width: 15px; height: 15px; flex: none; }

/* ============================================================
   布局：固定 3 列，保证所有卡片等宽（修样式不统一）
   ============================================================ */
main { padding: 20px 22px 56px; max-width: 1440px; margin: 0 auto; }

.grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
  align-items: start;          /* 各卡片高度独立，不互相拉伸 */
}
@media (max-width: 1180px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 760px)  { .grid { grid-template-columns: 1fr; } }

/* ============================================================
   卡片：所有卡片同一套骨架，行高统一
   ============================================================ */
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 15px 16px 14px;
  display: flex; flex-direction: column; gap: 11px;
  box-shadow: var(--shadow);
  transition: border-color .15s, background-color .15s;
  min-height: 178px;           /* 空内容卡片也与其他卡片等高，视觉统一 */
}
.card:hover { border-color: var(--border-strong); }
.card.running  { border-top: 2px solid var(--green); }
.card.stopped  { border-top: 2px solid var(--border-strong); }
.card.busy     { border-top: 2px solid var(--amber); }
.card.failed   { border-top: 2px solid var(--red); }
.card.disabled { opacity: .6; }

.card-head { display: flex; align-items: baseline; gap: 8px; min-height: 22px; }
.card-head .name {
  font-weight: 650; font-size: 15px; letter-spacing: .1px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.card-head .kind {
  font-size: 11px; color: var(--text-faint); margin-left: auto;
  white-space: nowrap; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
}
.card-head .kind.self { color: var(--accent); }

.status { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--text-dim); min-height: 20px; }
.led { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.led.on   { background: var(--green); box-shadow: 0 0 8px color-mix(in srgb, var(--green) 60%, transparent); }
.led.off  { background: var(--border-strong); }
.led.busy { background: var(--amber); animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }

/* 元信息行：固定两行高度，避免卡片因内容多少而错落 */
.meta {
  display: flex; flex-wrap: wrap; align-items: center; gap: 5px 12px;
  font-size: 12px; color: var(--text-dim); min-height: 38px;
}
.meta .ver { color: var(--accent); font-weight: 600; }
.meta a { color: var(--blue); text-decoration: none; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
.meta a:hover { text-decoration: underline; }
.meta .sep { color: var(--text-faint); }
.meta .warn   { color: var(--amber); }
.meta .behind { color: var(--blue); font-weight: 650; font-variant-numeric: tabular-nums; }
.meta .mono   { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
/* 子服务状态点：meta 行里也要有确定尺寸，不能依赖卡片上下文 */
.meta .led { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 4px; vertical-align: 0; }

.error {
  font-size: 12px; color: var(--red);
  background: color-mix(in srgb, var(--red) 10%, transparent);
  border: 1px solid color-mix(in srgb, var(--red) 35%, transparent);
  border-radius: 7px; padding: 7px 10px;
  max-height: 96px; overflow: auto;
}

.actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; padding-top: 2px; }
.actions button { padding: 5px 11px; font-size: 12px; border-radius: 6px; }

.logs {
  display: none; border-top: 1px solid var(--border); padding-top: 10px; margin-top: 2px;
  max-height: 240px; overflow: auto;
}
.logs.open { display: block; }
.logs pre {
  font: 11px/1.6 ui-monospace, "Cascadia Mono", Consolas, monospace;
  color: var(--text-dim); white-space: pre-wrap; word-break: break-all;
}

.hint { color: var(--text-faint); font-size: 13px; padding: 48px 0; text-align: center; }

/* 结果浮条 */
#toast {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
  background: var(--card); border: 1px solid var(--border);
  border-radius: 9px; padding: 11px 18px; font-size: 13px;
  max-width: min(640px, calc(100vw - 40px));
  box-shadow: 0 10px 32px rgba(0,0,0,.28);
  display: none; z-index: 100;
}
#toast.show { display: block; animation: rise .18s ease-out; }
@keyframes rise { from { opacity: 0; transform: translate(-50%, 8px); } }
#toast.ok  { border-color: var(--green); }
#toast.err { border-color: var(--red); }

/* 日志全屏抽屉 */
#drawer {
  position: fixed; inset: 0; background: rgba(0,0,0,.45);
  display: none; z-index: 90; padding: 4vh 4vw;
}
#drawer.open { display: block; }
#drawer .panel {
  background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  max-width: 1000px; margin: 0 auto; height: 92vh;
  display: flex; flex-direction: column; overflow: hidden;
}
#drawer .panel header {
  position: static; background: transparent; border-bottom: 1px solid var(--border);
  padding: 13px 18px;
}
#drawer .body { flex: 1; overflow: auto; padding: 14px 18px; background: var(--code-bg); }
#drawer pre {
  font: 12px/1.65 ui-monospace, "Cascadia Mono", Consolas, monospace;
  color: var(--text-dim); white-space: pre-wrap; word-break: break-all;
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg class="brand-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M12 2C6.48 2 2 6.48 2 12c0 4.42 2.87 8.17 6.84 9.5.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.89 1.53 2.34 1.09 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.56-1.11-4.56-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.02.8-.22 1.65-.33 2.5-.33s1.7.11 2.5.33c1.91-1.29 2.75-1.02 2.75-1.02.55 1.38.2 2.4.1 2.65.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.69-4.57 4.94.36.31.68.92.68 1.85v2.74c0 .27.18.58.69.48A9.99 9.99 0 0 0 22 12c0-5.52-4.48-10-10-10z"/>
    </svg>
    <b id="brand-name">github项目启动器</b><span class="ver" id="ver"></span>
  </div>
  <div class="spacer"></div>
  <div class="stat">
    <span class="led-dot"></span>
    <span data-i18n="running">运行</span> <b id="cnt-run">–</b> / <b id="cnt-total">–</b>
  </div>
  <button id="btn-start-all" data-i18n="startAll">全部启动</button>
  <button id="btn-update-all" class="primary" data-i18n="updateAll">批量更新</button>
  <button id="btn-stop-all" class="danger" data-i18n="stopAll">全部停止</button>
  <button id="btn-lang" class="icon" title="Language / 语言">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 8h14M7.5 8c0 4-1.8 7.5-4.5 9M10 8c0 3 1.5 5.5 4 7.5M12 20l3.5-9L19 20M13.2 17h5.6"/></svg>
    <span id="lang-label">EN</span>
  </button>
  <button id="btn-theme" class="icon" title="Theme / 主题">
    <svg id="icon-theme" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <span id="theme-label">Dark</span>
  </button>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="hint" id="hint" style="display:none" data-i18n="empty">没有项目。编辑 data/registry.json 添加。</div>
</main>

<div id="toast"></div>

<div id="drawer">
  <div class="panel">
    <header>
      <div class="brand"><b id="drawer-title">log</b></div>
      <div class="spacer"></div>
      <button id="drawer-close" class="ghost" data-i18n="close">关闭</button>
    </header>
    <div class="body"><pre id="drawer-body"></pre></div>
  </div>
</div>

<script>
/* ============================================================
   i18n：中英文案。UI 状态（运行中/未运行等）也在此翻译
   ============================================================ */
const I18N = {
  zh: {
    title: 'github项目启动器 · 项目管理',
    brand: 'github项目启动器',
    running: '运行', startAll: '全部启动', updateAll: '批量更新', stopAll: '全部停止',
    close: '关闭', empty: '没有项目。编辑 data/registry.json 添加。',
    runningStatus: '运行中', stoppedStatus: '未运行', starting: '启动中…', stopping: '停止中…',
    failedStatus: '启动失败', busy: '处理中…',
    start: '启动', stop: '停止', restart: '重启', update: '更新', manualUpdate: '手动更新', logs: '日志',
    cliTool: 'CLI 工具 · 无启停', desktopApp: '桌面程序', nonGit: '非 git',
    selfLabel: '自身',
    selfHint: '管理器自身：状态由当前进程提供，不能在看板里启停或更新。升级请手动 git pull 后重启。',
    versionLabel: '版本', versionUnknown: '版本未知',
    dirty: '有改动', ahead: '领先', behind: '落后',
    confirmStopAll: '将停止所有正在运行的项目（包括非本管理器启动的），确定？',
    confirmStartAll: '将启动所有未运行且可启动的项目，确定？',
    updating: '批量更新中，请稍候…',
    updateDone: (ok, total, failed) => `批量更新完成：成功 ${ok}/${total}` + (failed ? `；失败：${failed}` : ''),
    startDone: '全部启动完成', stopDone: '全部停止完成',
    noneToAct: '没有需要操作的项目',
    bulkStart: (n) => `全部启动：共 ${n} 个项目，逐个处理中…`,
    bulkStop: (n) => `全部停止：共 ${n} 个项目，逐个处理中…`,
    logTitle: (name) => `${name} · 日志`,
    logEmpty: '（暂无日志）',
    logLoadFail: (e) => `日志加载失败：${e}`,
    refreshFail: (e) => `刷新失败：${e}`,
    requestFail: (e) => `请求失败：${e}`,
    opFail: '操作失败',
    stashed: '已自动暂存本地改动',
    updatedTo: '已更新到最新',
    alreadyLatest: '已是最新',
  },
  en: {
    title: 'github_project_initiator · Project Manager',
    brand: 'github_project_initiator',
    running: 'Running', startAll: 'Start All', updateAll: 'Update All', stopAll: 'Stop All',
    close: 'Close', empty: 'No projects. Edit data/registry.json to add some.',
    runningStatus: 'Running', stoppedStatus: 'Stopped', starting: 'Starting…', stopping: 'Stopping…',
    failedStatus: 'Start failed', busy: 'Working…',
    start: 'Start', stop: 'Stop', restart: 'Restart', update: 'Update', manualUpdate: 'Manual', logs: 'Logs',
    cliTool: 'CLI tool · no lifecycle', desktopApp: 'Desktop app', nonGit: 'non-git',
    selfLabel: 'self',
    selfHint: 'The manager itself: status comes from its own process; it cannot be started, stopped, or updated from this dashboard. Upgrade with git pull and a restart.',
    versionLabel: 'version', versionUnknown: 'version unknown',
    dirty: 'dirty', ahead: 'ahead', behind: 'behind',
    confirmStopAll: 'This stops every running project (including ones not started by this manager). Continue?',
    confirmStartAll: 'This starts every stopped and startable project. Continue?',
    updating: 'Updating all projects, please wait…',
    updateDone: (ok, total, failed) => `Update done: ${ok}/${total} succeeded` + (failed ? `; failed: ${failed}` : ''),
    startDone: 'Start all done', stopDone: 'Stop all done',
    noneToAct: 'Nothing to do',
    bulkStart: (n) => `Starting all: ${n} project(s), one by one…`,
    bulkStop: (n) => `Stopping all: ${n} project(s), one by one…`,
    logTitle: (name) => `${name} · Logs`,
    logEmpty: '(no logs yet)',
    logLoadFail: (e) => `Failed to load logs: ${e}`,
    refreshFail: (e) => `Refresh failed: ${e}`,
    requestFail: (e) => `Request failed: ${e}`,
    opFail: 'Operation failed',
    stashed: 'Local changes auto-stashed',
    updatedTo: 'Updated to latest',
    alreadyLatest: 'Already up to date',
  },
};

// 语言与主题：优先读本地记忆，否则按系统语言 / 默认暗色
let lang = localStorage.getItem('gpi-lang') || (navigator.language.startsWith('zh') ? 'zh' : 'en');
let theme = localStorage.getItem('gpi-theme') || 'dark';

const t = (key, ...args) => {
  const v = I18N[lang][key];
  return typeof v === 'function' ? v(...args) : (v ?? key);
};

function applyLang() {
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.documentElement.dataset.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach((el) => {
    const key = el.dataset.i18n;
    if (typeof I18N[lang][key] === 'string') el.textContent = I18N[lang][key];
  });
  // 品牌名与页面标题也随语言切换
  const brand = document.getElementById('brand-name');
  if (brand) brand.textContent = I18N[lang].brand;
  document.title = I18N[lang].title;
  document.getElementById('lang-label').textContent = lang === 'zh' ? 'EN' : '中文';
  localStorage.setItem('gpi-lang', lang);
  render_now();
}

function applyTheme() {
  document.documentElement.dataset.theme = theme;
  document.getElementById('theme-label').textContent = theme === 'dark' ? 'Dark' : 'Light';
  // 暗色用月亮，亮色用太阳
  document.getElementById('icon-theme').innerHTML = theme === 'dark'
    ? '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'
    : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
  localStorage.setItem('gpi-theme', theme);
}

const API = '';
const grid = document.getElementById('grid');
const toast = document.getElementById('toast');
const drawer = document.getElementById('drawer');

/** 项目快照：{ key, project }，key 用于增量渲染判定 */
let snapshot = new Map();
let errors = new Map();
let busy = new Set();

/* ---------- 工具 ---------- */
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function fmtUptime(sec) {
  if (sec == null) return '';
  if (sec < 60) return `${sec}s`;
  if (sec < 3600) return `${Math.floor(sec/60)}m`;
  if (sec < 86400) return `${Math.floor(sec/3600)}h ${Math.floor((sec%3600)/60)}m`;
  return `${Math.floor(sec/86400)}d`;
}
function showToast(msg, ok = true, ms = 4000) {
  toast.textContent = msg;
  toast.className = `show ${ok ? 'ok' : 'err'}`;
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => (toast.className = ''), ms);
}

/* ---------- 渲染 ---------- */
function statusText(p) {
  if (busy.has(p.id)) return t('busy');
  if (p.phase === 'starting') return t('starting');
  if (p.phase === 'stopping') return t('stopping');
  if (p.phase === 'failed') return t('failedStatus');
  return p.running ? t('runningStatus') : t('stoppedStatus');
}
function ledClass(p) {
  if (busy.has(p.id) || p.phase === 'starting' || p.phase === 'stopping') return 'busy';
  if (p.phase === 'failed') return 'off';
  return p.running ? 'on' : 'off';
}
function cardStateClass(p) {
  if (busy.has(p.id) || p.phase === 'starting' || p.phase === 'stopping') return 'busy';
  if (p.phase === 'failed') return 'failed';
  return p.running ? 'running' : 'stopped';
}

function fmtVersion(v) {
  if (!v) return t('versionUnknown');
  const s = String(v);
  // git describe 在无 tag 时只给短 SHA：显示成 @abc1234，避免看起来像 v1.2.3
  if (/^[0-9a-f]{7,40}$/i.test(s)) return `@${s.slice(0, 7)}`;
  return /^v/i.test(s) ? s : `v${s}`;
}

function metaHtml(p) {
  const parts = [];
  const sep = '<span class="sep">·</span>';

  // 版本号放最前面：一眼能看到各项目当前版本
  if (p.version) {
    parts.push(`<span class="mono ver" title="${esc(t('versionLabel'))}">${esc(fmtVersion(p.version))}</span>`);
  } else {
    parts.push(`<span class="warn" title="${esc(t('versionLabel'))}">${esc(t('versionUnknown'))}</span>`);
  }

  // 第一行：地址 / 类型说明
  if (p.url) {
    parts.push(`<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.url.replace(/^https?:\/\//,''))}</a>`);
  } else if (p.kind === 'cli-tool') {
    parts.push(`<span>${esc(t('cliTool'))}</span>`);
  } else if (p.kind === 'desktop-app') {
    parts.push(`<span>${esc(t('desktopApp'))}</span>`);
  }

  // 多服务项目：逐个列出子服务端口与就绪状态（如 AutoTestHub 的 backend/frontend）
  if (p.services?.length) {
    for (const s of p.services) {
      const up = (p.openPorts ?? []).includes(s.port);
      const dot = up ? '<span class="led on"></span>' : '<span class="led off"></span>';
      const link = s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}:${s.port}</a>` : `${esc(s.label)}:${s.port}`;
      parts.push(`${dot}${link}`);
    }
  }

  // 运行时信息
  if (p.running && p.pids.length) parts.push(`<span class="mono">PID ${esc(p.pids.join(', '))}</span>`);
  if (p.running && p.uptimeSec != null) parts.push(`<span class="mono">${esc(fmtUptime(p.uptimeSec))}</span>`);
  if (p.runningVia === 'procname') parts.push(`<span class="warn">${esc(p.stop?.imageName || 'proc')}</span>`);

  // git 信息
  if (p.git.isRepo) {
    parts.push(`<span class="mono">⎇ ${esc(p.git.branch ?? '?')}</span>`);
    if (p.git.dirty) parts.push(`<span class="warn">● ${esc(t('dirty'))}</span>`);
    if (p.git.behind > 0) parts.push(`<span class="behind">↓${p.git.behind}</span>`);
    if (p.git.ahead > 0) parts.push(`<span>↑${p.git.ahead}</span>`);
  } else {
    parts.push(`<span class="warn">${esc(t('nonGit'))}</span>`);
  }

  return parts.length ? `<div class="meta">${parts.join(sep)}</div>` : '<div class="meta"></div>';
}

function actionsHtml(p) {
  const dis = busy.has(p.id) ? 'disabled' : '';
  const b = [];
  // 管理器自身：启停/重启在物理上没有意义（停掉自己看板就没了），只保留日志。
  if (!p.self) {
    if (p.running) {
      b.push(`<button data-act="stop" data-id="${esc(p.id)}" ${dis}>${esc(t('stop'))}</button>`);
      b.push(`<button data-act="restart" data-id="${esc(p.id)}" ${dis}>${esc(t('restart'))}</button>`);
    } else if (p.startable) {
      b.push(`<button data-act="start" data-id="${esc(p.id)}" class="primary" ${dis}>${esc(t('start'))}</button>`);
    }
    if (p.updatable) {
      const label = p.git.behind > 0 ? `${t('update')} ↓${p.git.behind}` : t('update');
      b.push(`<button data-act="update" data-id="${esc(p.id)}" ${dis}>${esc(label)}</button>`);
    } else {
      b.push(`<button data-act="update" data-id="${esc(p.id)}" ${dis} title="${esc(p.notes || '')}">${esc(t('manualUpdate'))}</button>`);
    }
  }
  b.push(`<button data-act="logs" data-id="${esc(p.id)}" ${dis}>${esc(t('logs'))}</button>`);
  return `<div class="actions">${b.join('')}</div>`;
}

function cardHtml(p) {
  const cls = [cardStateClass(p), p.enabled === false ? 'disabled' : ''].filter(Boolean).join(' ');
  const err = errors.get(p.id);
  const kindLabel = p.self ? `${t('selfLabel')} · ${p.kind}` : p.kind;
  const kindTitle = p.self ? t('selfHint') : (p.notes || '');
  return `
    <div class="card ${cls}" data-card="${esc(p.id)}">
      <div class="card-head">
        <span class="name" title="${esc(p.name)}">${esc(p.name)}</span>
        <span class="kind${p.self ? ' self' : ''}" title="${esc(kindTitle)}">${esc(kindLabel)}</span>
      </div>
      <div class="status"><span class="led ${ledClass(p)}"></span>${esc(statusText(p))}</div>
      ${metaHtml(p)}
      ${err ? `<div class="error">${esc(err)}</div>` : ''}
      ${actionsHtml(p)}
      <div class="logs" data-logs="${esc(p.id)}"><pre></pre></div>
    </div>`;
}

/** 增量渲染：只重建内容变化的卡片 */
function render(projects) {
  const seen = new Set();
  for (const p of projects) {
    seen.add(p.id);
    const key = JSON.stringify([p, busy.has(p.id), errors.get(p.id), lang]);
    const prev = snapshot.get(p.id);
    if (prev?.key === key) continue;
    const html = cardHtml(p);
    const existing = grid.querySelector(`[data-card="${CSS.escape(p.id)}"]`);
    if (existing) existing.outerHTML = html;
    else grid.insertAdjacentHTML('beforeend', html);
    snapshot.set(p.id, { key, project: p });
  }
  for (const id of [...snapshot.keys()]) {
    if (seen.has(id)) continue;
    grid.querySelector(`[data-card="${CSS.escape(id)}"]`)?.remove();
    snapshot.delete(id);
    errors.delete(id);
  }
  document.getElementById('cnt-run').textContent = projects.filter(p => p.running).length;
  document.getElementById('cnt-total').textContent = projects.length;
  document.getElementById('hint').style.display = projects.length ? 'none' : 'block';
}
function render_now() {
  const list = [...snapshot.values()].map(v => v.project).filter(Boolean);
  if (list.length) render(list);
}

/* ---------- 数据 ---------- */
async function refresh() {
  try {
    const res = await fetch(`${API}/api/projects`);
    const data = await res.json();
    render(data.projects ?? []);
  } catch (err) {
    showToast(t('refreshFail', err.message), false);
  }
}

async function act(action, id) {
  busy.add(id); errors.delete(id); render_now();
  try {
    const res = await fetch(`${API}/api/projects/${encodeURIComponent(id)}/${action}`, { method: 'POST' });
    const data = await res.json();
    if (data.ok === false) {
      errors.set(id, data.message || data.error || t('opFail'));
      showToast(data.message || t('opFail'), false);
    } else {
      showToast(data.message || t('opFail'), true);
    }
  } catch (err) {
    const msg = t('requestFail', err.message);
    errors.set(id, msg); showToast(msg, false);
  } finally {
    busy.delete(id);
    await refresh();
  }
}

async function updateAll() {
  busy.add('__all__'); showToast(t('updating'), true, 120000);
  try {
    const res = await fetch(`${API}/api/update-all`, { method: 'POST' });
    const data = await res.json();
    const results = data.results ?? [];
    const okCount = results.filter(r => r.ok).length;
    const failed = results.filter(r => !r.ok).map(f => f.name);
    showToast(t('updateDone', okCount, results.length, failed.join(', ')), failed.length === 0, 10000);
  } catch (err) {
    showToast(t('requestFail', err.message), false);
  } finally {
    busy.delete('__all__'); await refresh();
  }
}

async function bulkAction(action) {
  const msg = action === 'start' ? t('confirmStartAll') : t('confirmStopAll');
  if (!confirm(msg)) return;
  const res = await fetch(`${API}/api/projects`);
  const data = await res.json();
  // 全部停止必须排除管理器自身：把它算进去等于让"全部停止"顺手关掉看板。
  const targets = data.projects.filter(p => action === 'start'
    ? (p.startable && !p.running)
    : (p.running && !p.self));
  if (!targets.length) { showToast(t('noneToAct'), true); return; }
  showToast(t(action === 'start' ? 'bulkStart' : 'bulkStop', targets.length), true, 180000);
  for (const p of targets) {
    busy.add(p.id); render_now();
    try {
      const r = await fetch(`${API}/api/projects/${encodeURIComponent(p.id)}/${action}`, { method: 'POST' });
      const d = await r.json();
      if (d.ok === false) errors.set(p.id, d.message);
    } catch (err) { errors.set(p.id, err.message); }
    finally { busy.delete(p.id); }
  }
  await refresh();
  showToast(t(action === 'start' ? 'startDone' : 'stopDone'), true);
}

/* ---------- 日志 ---------- */
async function openLogs(id) {
  const p = snapshot.get(id)?.project;
  document.getElementById('drawer-title').textContent = t('logTitle', p?.name ?? id);
  document.getElementById('drawer-body').textContent = '…';
  drawer.classList.add('open');
  try {
    const res = await fetch(`${API}/api/projects/${encodeURIComponent(id)}/logs?lines=500`);
    const data = await res.json();
    const lines = data.lines ?? [];
    document.getElementById('drawer-body').textContent = lines.length ? lines.join('\n') : t('logEmpty');
  } catch (err) {
    document.getElementById('drawer-body').textContent = t('logLoadFail', err.message);
  }
}

/* ---------- 事件 ---------- */
grid.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-act]');
  if (!btn || btn.disabled) return;
  const { act: action, id } = btn.dataset;
  if (action === 'logs') openLogs(id);
  else act(action, id);
});
document.getElementById('btn-update-all').addEventListener('click', updateAll);
document.getElementById('btn-start-all').addEventListener('click', () => bulkAction('start'));
document.getElementById('btn-stop-all').addEventListener('click', () => bulkAction('stop'));
document.getElementById('drawer-close').addEventListener('click', () => drawer.classList.remove('open'));
drawer.addEventListener('click', (e) => { if (e.target === drawer) drawer.classList.remove('open'); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') drawer.classList.remove('open'); });

document.getElementById('btn-lang').addEventListener('click', () => {
  lang = lang === 'zh' ? 'en' : 'zh';
  applyLang();
});
document.getElementById('btn-theme').addEventListener('click', () => {
  theme = theme === 'dark' ? 'light' : 'dark';
  applyTheme();
});

/* ---------- 启动 ---------- */
applyTheme();
applyLang();
refresh();
setInterval(refresh, 3000);

// 版本号（用于顶栏显示，便于确认跑的是哪份代码）
fetch(`${API}/api/health`).then(r => r.json()).then(d => {
  if (d.version) document.getElementById('ver').textContent = d.version;
}).catch(() => {});
</script>
